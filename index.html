<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEWS SQUARE">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 検索エンジンに載せない設定。公開して検索に載せたい場合はこの行を削除 -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>NEWS SQUARE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 夜のタイムズスクエア。眩しいけれど読みやすい
   IDEA: 交差点の角に立つ2面のLEDビルボード（左=日本／右=世界）
   PICTURE: 虹色の光線が回るLED画面に、ドット文字の見出しが打ち出される
   COLOUR and TYPE: 夜の黒地＋日本=レッド／世界=シアン、DotGothic16 と Zen Kaku Gothic New
   LAYOUT: 時計バー → 角ビルボード → 2段の電光テロップ → フィルタ付きニュース一覧 */
:root{color-scheme:dark;--bg:#07070c;--panel:#11111b;--panel2:#171724;--line:#262638;--ink:#f4f2ec;--mute:#a3a1b3;--jp:#ff3b5c;--wd:#33d2ff;--amb:#ffb21e}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.dot{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-weight:900}
/* 文字そのものを細かいLEDドットで描く（2pxピッチ） */
.led{--lc:#fff;background:radial-gradient(circle,var(--lc) 0 .78px,transparent 1.02px) 0 0/2px 2px;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,14px)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:16px 0 10px}
.logo{font-size:clamp(28px,4.4vw,42px);line-height:1;letter-spacing:.04em;margin:0}
.logo b{--lc:var(--jp);font-weight:900;filter:drop-shadow(0 0 6px rgba(255,59,92,.7))}.logo i{--lc:var(--wd);font-style:normal;filter:drop-shadow(0 0 6px rgba(51,210,255,.7))}
.clocks{display:flex;flex-wrap:wrap;gap:6px}
.clk{background:#000;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--mute);white-space:nowrap}
.clk span{color:var(--amb);font-size:16px;margin-left:6px}

/* billboards */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);perspective:1500px;padding:18px 0 8px;max-width:1080px;margin:0 auto}
.scr{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000;border:6px solid #15151f;box-shadow:0 30px 80px -30px var(--glow),0 0 0 1px #2c2c3c inset}
.scr.l{--glow:rgba(255,59,92,.55);transform:rotateY(16deg);transform-origin:right center;border-right-width:3px}
.scr.r{--glow:rgba(51,210,255,.5);transform:rotateY(-16deg);transform-origin:left center;border-left-width:3px}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.55) 0 6deg,transparent 6deg 15deg),conic-gradient(#ff2d55,#ff8a1c,#ffe14d,#3ddc84,#2fd0ff,#7a5cff,#ff2d55);animation:spin 24s linear infinite;opacity:.8}
.scr.r .rays{animation-direction:reverse;filter:hue-rotate(150deg)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 48%,rgba(4,4,12,.92) 0 46%,rgba(4,4,12,.55) 70%,rgba(0,0,0,.1) 100%)}
.leds{position:absolute;inset:0;background:radial-gradient(circle,transparent 0 .7px,rgba(0,0,0,.42) 1px);background-size:2px 2px;pointer-events:none;z-index:3}
.scan{position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(transparent,rgba(255,255,255,.07),transparent);animation:scan 5s linear infinite;z-index:2;pointer-events:none}
.face{position:absolute;inset:0;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:6% 8% 0}
.tag{justify-self:start;align-self:start;font-size:13px;padding:3px 10px;border-radius:3px;background:var(--c);color:#000;letter-spacing:.04em}
.scr.l .face{--c:var(--jp)}.scr.r .face{--c:var(--wd)}
.hdw{display:flex;align-items:center;min-height:0;overflow:hidden;padding:4px 0;filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 1px #fff)}
.hd{margin:0;font-size:clamp(20px,2.8vw,32px);line-height:1.36;letter-spacing:.03em;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.hd .cur{animation:blink .8s steps(1) infinite}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#d9d7e6;padding:4px 0 8px;white-space:nowrap}
.meta .src{overflow:hidden;text-overflow:ellipsis}.meta .num{flex:none}
.strip{margin:0 -8.7%;background:var(--c);color:#000;font-size:14px;padding:6px 0;overflow:hidden;white-space:nowrap}
.strip span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite}
.glitch .face{animation:gl .45s steps(2)}
.ctl{position:absolute;z-index:4;inset:8px 8px auto auto;display:flex;gap:6px}
.ctl button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer}
.pole{height:14px;max-width:1080px;margin:0 auto;background:linear-gradient(#1b1b28,#0d0d15);border-radius:0 0 8px 8px}

/* tickers */
.tick{overflow:hidden;white-space:nowrap;background:#000;border-block:1px solid var(--line);font-size:clamp(15px,2vw,19px);padding:8px 0}
.tick+.tick{border-top:0}
.run{display:inline-block;animation:mq var(--d,90s) linear infinite}
.tick:hover .run{animation-play-state:paused}
.run a{text-decoration:none;margin-right:3em}
.run a::before{content:"◆ ";font-size:.8em}
.tick{font-size:clamp(17px,2.2vw,21px);letter-spacing:.04em}
.tick.jp .run{--lc:#ff5470;filter:drop-shadow(0 0 4px rgba(255,59,92,.8))}
.tick.wd .run{--lc:#5cdcff;filter:drop-shadow(0 0 4px rgba(51,210,255,.8))}
.tick.am .run{--lc:#ffc24a;filter:drop-shadow(0 0 4px rgba(255,178,30,.8))}
.run b{font-weight:900;margin-right:3em}
.clk em{font-style:normal;color:#d9d7e6;margin-left:8px;font-size:13px}
.tick .lb{position:sticky;left:0}

/* list */
.band{padding-block:28px 56px}
.sec{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec h2{margin:0;font-size:clamp(24px,3.4vw,34px);line-height:1.1;font-weight:400}
.note{color:var(--mute);font-size:13px;margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button,.chip{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#000}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel)}
.chip[aria-pressed=true]{border-color:var(--amb);color:var(--amb)}
.search{flex:1 1 200px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px;padding:0 18px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s}
.card:hover{border-color:#3a3a55;transform:translateY(-2px)}
.k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.k .rg{display:inline-flex;align-items:center;gap:5px;color:var(--c)}
.k .rg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.k time{margin-left:auto;white-space:nowrap}
.card h3{margin:0;font-size:17px;line-height:1.5;font-weight:700}
.card p{margin:0;color:#c9c7d6;font-size:14px;line-height:1.6}
.card .orig{color:var(--mute);font-size:13px;line-height:1.45}
.acts{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;font-size:13px}
.acts .src{color:var(--mute);margin-right:auto}
.acts button,.acts a{min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.foot{color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding:18px 0 40px}

.live{color:#3dff8a;filter:drop-shadow(0 0 4px #3dff8a);animation:blink 1.6s steps(1) infinite}
.refresh{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.new{display:inline-block;font-size:11px;font-weight:900;color:#000;background:#3dff8a;border-radius:3px;padding:0 6px;margin-right:6px;vertical-align:2px}
.card.fresh{border-color:#3dff8a55}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:#000;border:1px solid #3dff8a;color:#3dff8a;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;transition:transform .35s;white-space:nowrap}
.toast:not(.on){opacity:0;visibility:hidden}.toast.on{transform:translate(-50%,0)}
/* iPhoneの時計・電池表示（ノッチ）と重ならないよう安全領域ぶん空ける */
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:50;pointer-events:none}
.toast{bottom:calc(20px + env(safe-area-inset-bottom))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{to{top:110%}}
@keyframes mq{to{transform:translateX(-50%)}}
.strip span{animation-name:mq2}@keyframes mq2{to{transform:translateX(-100%)}}
@keyframes blink{50%{opacity:0}}
@keyframes gl{0%{clip-path:inset(10% 0 60% 0);transform:translateX(-6px);filter:hue-rotate(90deg)}50%{clip-path:inset(55% 0 5% 0);transform:translateX(6px)}100%{clip-path:none;transform:none}}

@media(max-width:700px){
  .stage{grid-template-columns:minmax(0,1fr);gap:14px;perspective:none}
  .scr.l,.scr.r{transform:none;border-width:5px;aspect-ratio:auto;height:clamp(300px,88vw,380px)}
  .pole{display:none}
  .hd{font-size:clamp(18px,5.6vw,24px)}
  .tag{font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.run{white-space:normal}.tick{white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo dot"><b class="led">NEWS</b> <i class="led">SQUARE</i></h1>
    <div class="clocks" id="clocks"></div>
  </header>
</div>

<div class="wrap">
  <div class="stage" aria-label="ニュースビルボード">
    <section class="scr l" id="bJ" aria-live="polite">
      <div class="rays"></div><div class="vig"></div><div class="scan"></div>
      <div class="face"><span class="tag dot">JAPAN</span><div class="hdw"><h2 class="hd dot led"></h2></div><div class="meta dot"><span class="src"></span><span class="num"></span></div><div class="strip dot"><span></span></div></div>
      <div class="leds"></div>
      <div class="ctl"><button data-b="jp" data-step="-1" aria-label="前のニュース">◀</button><button data-b="jp" data-step="1" aria-label="次のニュース">▶</button></div>
    </section>
    <section class="scr r" id="bW" aria-live="polite">
      <div class="rays"></div><div class="vig"></div><div class="scan"></div>
      <div class="face"><span class="tag dot">WORLD</span><div class="hdw"><h2 class="hd dot led"></h2></div><div class="meta dot"><span class="src"></span><span class="num"></span></div><div class="strip dot"><span></span></div></div>
      <div class="leds"></div>
      <div class="ctl"><button data-b="wd" data-step="-1" aria-label="前のニュース">◀</button><button data-b="wd" data-step="1" aria-label="次のニュース">▶</button></div>
    </section>
  </div>
  <div class="pole"></div>
</div>

<div style="margin-top:22px">
  <div class="tick jp dot"><div class="run led" id="tJ"></div></div>
  <div class="tick wd dot"><div class="run led" id="tW"></div></div>
  <div class="tick am dot"><div class="run led" id="tA"></div></div>
</div>

<main class="wrap band">
  <div class="sec">
    <div>
      <h2 class="dot">ヘッドライン一覧</h2>
      <p class="note" id="status"><span class="live">● LIVE</span> 受信準備中…</p>
    </div>
    <button class="refresh" id="refresh">今すぐ更新</button>
  </div>
  <div class="bar">
    <div class="seg" role="group" aria-label="地域">
      <button data-r="all" aria-pressed="true">すべて</button>
      <button data-r="jp" aria-pressed="false" id="segJ">日本</button>
      <button data-r="wd" aria-pressed="false" id="segW">世界</button>
    </div>
    <input class="search" id="q" type="search" placeholder="キーワードで絞り込み" aria-label="キーワード検索">
  </div>
  <div class="chips" id="chips" role="group" aria-label="カテゴリ"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="wrap foot" id="foot">
  出典は config.json で設定したフィードです。見出しとリンクのみを表示しています。
</div>

<script>
{
const DEMO=[
 ['jp','はじめに','NEWS SQUARE へようこそ。ニュースを受信するとここに流れます'],
 ['jp','使い方','config.json の feeds に好きな RSS を書くと、自分専用の電光掲示板になります'],
 ['jp','使い方','10分ごとに GitHub Actions が新着を取得します'],
 ['wd','About','English headlines are translated into Japanese automatically'],
 ['wd','About','左は日本、右は世界。地域名も config.json で変えられます']
];
const SEED=DEMO.map(([r,c,t],i)=>({r,c,t,s:'NEWS SQUARE',u:'https://github.com/owner0104/news-square',d:new Date(Date.now()-i*60000).toISOString()}));
let REG={jp:{label:'JAPAN 日本',short:'日本'},wd:{label:'WORLD 世界',short:'世界'}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const POLL=60000;
/* 天気（Open-Meteo：ブラウザから直接取得）と音楽ランキング */
let WX=[],WXLIST=[],MUSIC=[];
const WMO=c=>c===0?'快晴':c<=2?'晴れ':c===3?'くもり':c<=48?'霧':c<=57?'霧雨':c<=67?'雨':c<=77?'雪':c<=82?'にわか雨':c<=86?'にわか雪':'雷雨';
async function loadWeather(){
  if(!WXLIST.length)return;
  try{
    const q=`https://api.open-meteo.com/v1/forecast?latitude=${WXLIST.map(c=>c.lat).join(',')}&longitude=${WXLIST.map(c=>c.lon).join(',')}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2`;
    let j=await (await fetch(q)).json();if(!Array.isArray(j))j=[j];
    WX=j.map((w,i)=>({name:WXLIST[i].name,now:Math.round(w.current.temperature_2m),code:w.current.weather_code,max:Math.round(w.daily.temperature_2m_max[0]),min:Math.round(w.daily.temperature_2m_min[0]),pop:w.daily.precipitation_probability_max[0],tcode:w.daily.weather_code[1],tmax:Math.round(w.daily.temperature_2m_max[1]),tmin:Math.round(w.daily.temperature_2m_min[1])}));
    fillAm();tick();
  }catch(e){}
}
setInterval(loadWeather,15*60000);
let amSig='';
function fillAm(){
  const w=WX.map(x=>`${x.name} ${WMO(x.code)} ${x.now}°（最高${x.max}° 最低${x.min}° 降水${x.pop??'-'}%）あす ${WMO(x.tcode)} ${x.tmax}°/${x.tmin}°`);
  const m=MUSIC.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">♪ ${esc(x.label)} ${x.rank}位 ${esc(x.name)} ／ ${esc(x.artist)}</a>`);
  const html=(w.length?`<b>WEATHER</b>`+w.map(t=>`<a>${esc(t)}</a>`).join(''):'')+(m.length?`<b>MUSIC</b>`+m.join(''):'');
  if(!html||html===amSig)return;amSig=html;
  const el=document.getElementById('tA');el.innerHTML=html+html;el.style.setProperty('--d',Math.round(el.textContent.length/2*0.3)+'s');
}
let BOARD=45;
/* 配信元ごとに新しい順に並べ、順番に取り出して混ぜる（同じ配信元ばかり続かないように）。一般ニュースのWikipediaは1巡で3件 */
function mix(list){
  const g=new Map();
  for(const n of [...list].sort((a,b)=>b.d.localeCompare(a.d))){if(!g.has(n.s))g.set(n.s,[]);g.get(n.s).push(n)}
  const qs=[...g.values()].sort((a,b)=>b[0].d.localeCompare(a[0].d)),out=[];
  while(qs.some(q=>q.length))for(const q of qs)for(let k=0;k<(q[0]?.s==='Wikipedia'?3:1);k++)if(q.length)out.push(q.shift());
  return out;
}
let N=SEED,updated=null,known=null,live=false,nextAt=Date.now();

/* time helpers */
const jst=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);return m<1?'たった今':m<60?m+'分前':m<1440?Math.floor(m/60)+'時間前':jst.format(new Date(iso))};

/* clocks + status */
const zones=[['TOKYO','Asia/Tokyo','東京'],['NEW YORK','America/New_York','ニューヨーク'],['LONDON','Europe/London','ロンドン']];
const clocks=document.getElementById('clocks'),status=document.getElementById('status');
const tick=()=>{
  clocks.innerHTML=zones.map(([n,z,c])=>{const w=WX.find(x=>x.name===c);return `<div class="clk dot">${n}<span>${new Intl.DateTimeFormat('ja-JP',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}</span>${w?`<em>${WMO(w.code)} ${w.now}°</em>`:''}</div>`}).join('');
  const sec=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
  status.innerHTML=live?`<span class="live">● LIVE</span> ニュース取得 ${esc(ago(updated))}（${esc(jst.format(new Date(updated)))}）・次の確認まで ${sec}秒`
    :`<span style="color:var(--amb)">● OFFLINE</span> 最新データを受信できないため、保存済みのニュースを表示中・${sec}秒後に再試行`;
};
setInterval(tick,1000);

/* billboards */
const boards={jp:{el:document.getElementById('bJ'),list:[],i:0},wd:{el:document.getElementById('bW'),list:[],i:0}};
function show(key,i){
  const b=boards[key];if(!b.list.length)return;b.i=(i+b.list.length)%b.list.length;const n=b.list[b.i],nx=b.list[(b.i+1)%b.list.length];
  const hd=b.el.querySelector('.hd');clearInterval(b.typer);
  b.el.classList.remove('glitch');void b.el.offsetWidth;b.el.classList.add('glitch');
  b.el.querySelector('.src').textContent=`${n.s||'—'}｜${n.c}${n.o?'｜自動翻訳':''}｜${ago(n.d)}`;
  b.el.querySelector('.num').textContent=`${String(b.i+1).padStart(2,'0')}/${String(b.list.length).padStart(2,'0')}`;
  b.el.querySelector('.strip span').textContent=`NEXT ▸ ${nx.t}`;
  b.el.querySelector('.tag').textContent=(known&&n.isNew?'NEW ● ':'')+REG[key].label;
  if(RM){hd.textContent=n.t;return}
  let k=0;hd.innerHTML='<span></span><span class="cur">▌</span>';const sp=hd.firstChild;
  b.typer=setInterval(()=>{sp.textContent=n.t.slice(0,++k);if(k>=n.t.length)clearInterval(b.typer)},45);
}
/* 1周したら最新データを取り直してから次の周へ */
function auto(key){clearInterval(boards[key].loop);boards[key].loop=setInterval(()=>{const b=boards[key];if(b.i+1>=b.list.length)load(false);show(key,b.i+1)},7500)}
document.querySelectorAll('.ctl button').forEach(btn=>btn.addEventListener('click',()=>{const k=btn.dataset.b;show(k,boards[k].i+ +btn.dataset.step);auto(k)}));

/* tickers */
const tick2={};
function fill(id,r){
  const list=mix(N.filter(n=>n.r===r)).slice(0,BOARD),sig=list.map(n=>n.t).join('|');if(tick2[id]===sig)return;tick2[id]=sig;
  const el=document.getElementById(id);const items=list.map(n=>`<a href="${esc(n.u)}" target="_blank" rel="noopener">${n.isNew&&known?'NEW ':''}${esc(n.t)}</a>`).join('');
  el.innerHTML=items+items;el.style.setProperty('--d',Math.round(list.reduce((a,n)=>a+n.t.length,0)*0.3)+'s');
}

/* list */
const st={r:'all',c:'すべて',q:''};
const grid=document.getElementById('grid'),chips=document.getElementById('chips');
function renderChips(){
  const cats=['すべて',...new Set(N.filter(n=>st.r==='all'||n.r===st.r).map(n=>n.c))];
  if(!cats.includes(st.c))st.c='すべて';
  chips.innerHTML=cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===st.c}">${esc(c)}</button>`).join('');
}
function render(){
  const q=st.q.trim().toLowerCase();
  const rows=N.filter(n=>(st.r==='all'||n.r===st.r)&&(st.c==='すべて'||n.c===st.c)&&(!q||(n.t+(n.o||'')+(n.p||'')+n.s+n.c).toLowerCase().includes(q)));
  grid.innerHTML=rows.length?rows.map(n=>{const idx=N.indexOf(n);return `<article class="card${n.isNew&&known?' fresh':''}" style="--c:var(--${n.r})">
    <div class="k"><span class="rg">${esc(REG[n.r]?.short||n.r)}</span><span>${esc(n.c)}</span><time datetime="${esc(n.d)}">${esc(ago(n.d))}</time></div>
    <h3>${n.isNew&&known?'<span class="new">NEW</span>':''}${esc(n.t)}</h3>${n.o?`<p class="orig" lang="en">${esc(n.o)}</p>`:''}${n.p?`<p>${esc(n.p)}</p>`:''}
    <div class="acts"><span class="src">${esc(n.s)}</span><button data-i="${idx}">ビルボードに表示</button><a href="${esc(n.u)}" target="_blank" rel="noopener">記事 ↗</a></div></article>`}).join(''):'<p class="empty">該当するニュースがありません。条件を変えてみてください。</p>';
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{st.r=b.dataset.r;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderChips();render()}));
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.c=b.dataset.c;renderChips();render()});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;render()});
grid.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const n=N[+b.dataset.i];const k=n.r;show(k,boards[k].list.indexOf(n));auto(k);boards[k].el.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})});

/* apply data */
const toast=document.createElement('div');toast.className='toast dot';document.body.append(toast);
function apply(items,first){
  const keys=new Set(items.map(n=>n.t));
  const fresh=known?items.filter(n=>!known.has(n.t)):[];
  items.forEach(n=>n.isNew=n.isNew||fresh.includes(n));
  N=items;
  for(const k of ['jp','wd']){
    const b=boards[k],cur=b.list[b.i];
    b.list=mix(N.filter(n=>n.r===k)).slice(0,BOARD);
    const nf=fresh.find(n=>n.r===k);
    if(first||nf){show(k,nf?b.list.indexOf(nf):0);auto(k)}else{b.i=Math.max(0,b.list.indexOf(cur))}
  }
  fill('tJ','jp');fill('tW','wd');renderChips();render();
  if(fresh.length){toast.textContent=`● 新着ニュース ${fresh.length}件`;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),4000)}
  known=keys;
}
async function load(first){
  nextAt=Date.now()+POLL;
  try{
    const res=await fetch('news.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw 0;
    const j=await res.json();if(!j.items?.length)throw 0;
    live=true;
    if(j.regions){REG={...REG,...j.regions};document.getElementById('segJ').textContent=REG.jp.short;document.getElementById('segW').textContent=REG.wd.short}
    if(j.title){document.title=j.title}
    if(j.boardCount){BOARD=j.boardCount}
    if(j.sources){document.getElementById('foot').innerHTML=`出典：${esc(j.sources.join('、'))}、<a href="https://en.wikipedia.org/wiki/Portal:Current_events" target="_blank" rel="noopener">Wikipedia Current events</a>（CC BY-SA 4.0）。天気：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>（CC BY 4.0）。音楽：Apple Music ランキング。見出しとリンクのみを表示し、英語の見出しは自動翻訳です。`}
    if(j.music){MUSIC=j.music}
    if(j.weather&&j.weather.length&&!WXLIST.length){WXLIST=j.weather;loadWeather()}
    fillAm();
    if(j.updated!==updated){updated=j.updated;apply(j.items,first)}
  }catch(e){live=false;if(first){apply(SEED,true)}}
  tick();
}
document.getElementById('refresh').addEventListener('click',()=>load(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()>nextAt-POLL+15000)load(false)});
load(true);setInterval(()=>load(false),POLL);
setInterval(()=>{for(const t of grid.querySelectorAll('time'))t.textContent=ago(t.getAttribute('datetime'))},60000);
}
</script>
</body>
</html>
