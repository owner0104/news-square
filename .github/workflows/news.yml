name: ニュース自動取得
on:
  schedule:
    - cron: '*/10 * * * *'   # 10分ごと（GitHubの混雑で数分遅れることがあります）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: 変更があればコミット
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
